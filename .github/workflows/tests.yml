name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (macOS)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('TOM.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Integration tests are env-gated (TOM_INTEGRATION_TESTS) and stay off
      # here: CI has no AI models on disk. CODE_SIGNING is disabled because
      # runners have no signing identity for the team.
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project TOM.xcodeproj \
            -scheme TOM \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            > test-output.log 2>&1 \
            || (grep -E "error:|Test case .* failed|TEST FAILED" test-output.log | head -50; exit 1)
          grep -cE "Test case .* passed" test-output.log

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
